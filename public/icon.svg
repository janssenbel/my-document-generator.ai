<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="512" height="512">
  <defs>
    <linearGradient id="pinkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>
  <!-- Full-bleed Pink Background (no outer border) -->
  <rect width="180" height="180" fill="url(#pinkBg)" />
  <!-- Top Paper Feeder (White) -->
  <rect x="54" y="26" width="72" height="25" rx="6" fill="#FFFFFF" />
  <!-- Main Printer Body (White) -->
  <rect x="28" y="56" width="124" height="64" rx="16" fill="#FFFFFF" />
  <!-- Printer Status LED Dots (Pink) -->
  <circle cx="130" cy="76" r="5.5" fill="#DB2777" />
  <circle cx="114" cy="76" r="4" fill="#F472B6" />
  <!-- Recessed Paper Output Slot (Pink) -->
  <rect x="48" y="98" width="84" height="26" rx="6" fill="#DB2777" />
  <!-- Bottom Printed Paper (White) -->
  <rect x="54" y="104" width="72" height="48" rx="6" fill="#FFFFFF" />
  <!-- Printed Document Lines (Pink) -->
  <rect x="66" y="118" width="48" height="5.5" rx="2.75" fill="#EC4899" />
  <rect x="66" y="131" width="34" height="5.5" rx="2.75" fill="#EC4899" />
</svg>
